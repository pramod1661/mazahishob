name: Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supabase publishable client values are safe to bundle in a public app.
    # Database access remains protected by Supabase Auth and RLS policies.
    env:
      VITE_SUPABASE_URL: "https://appyfdveqgxjxvooaube.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Ktk2E91a7qLHSElX2wFOyw_4PWtM8QV"
      VITE_SUPABASE_ANON_KEY: "sb_publishable_Ktk2E91a7qLHSElX2wFOyw_4PWtM8QV"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify Supabase public access
        run: npm run test:supabase-security

      - name: Sync web app to Android
        run: npm run android:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: maza-hishob-v1.0.5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
